user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include mime.types;
  default_type application/octet-stream;

  # gzip on;
  # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  # gzip_min_length 1000;
  # gzip_proxied any;

  client_max_body_size 10M;

  sendfile on;
  keepalive_timeout 65;
}

server {
  listen 80;
  server_name lukacerrutti.com www.lukacerrutti.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 default_server ssl http2;
  server_name lukacerrutti.com www.lukacerrutti.com;

  ssl_certificate /etc/letsencrypt/live/lukacerrutti.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/lukacerrutti.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # location /public/ {}

  location /api {
    proxy_pass http://127.0.0.1:500;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}
