services:
  redis:
    image: redis:alpine
    container_name: app-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--raw', 'incr', 'ping']

  api:
    image: user/api:stable
    container_name: app-api
    restart: always
    env_file: ./.env
    ports:
      - '${API_PORT}'
    networks:
      - app-network
    depends_on:
      - redis

#volumes:
#  db_data:

networks:
  app-network:
